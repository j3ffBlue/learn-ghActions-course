name: build-test-deploy

on: push

jobs: 
  build: 
     runs-on: ubuntu-latest
     steps:
       - name: checkout repo
         uses: actions/checkout@v5
       - name: use node.js
         uses: actions/setup-node@v5
         with:
            node-version: '22.x'
       - run: node --trace-deprecation
       - run: npn install 
       - run: npn run build
       
         
