name: Require python setup

on: workflow_dispatch

jobs:
   build:
      runs-on: ubuntu-latest
      defaults:
        run:
         working-directory: .github/workflows/scripts
      steps:
        - uses: actions/checkout@v6
        - uses: actions/setup-python@v6
          with:
            python-version: '3.13'
        - run: echo $PWD
        - run: python myscript.py
            
      
