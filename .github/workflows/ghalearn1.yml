name: Require python setup

on: workflow_dispatch

jobs:
   build:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v6
        - uses: actions/setup-python@v6
          with:
            python-version: '3.13'
        - run: mkdir -p /home/runner/work/learn-ghActions-course/learn-ghActions-course/scripts/
        - run: cd /home/runner/work/learn-ghActions-course/learn-ghActions-course/scripts/
        - run: python myscript.py
            
      
